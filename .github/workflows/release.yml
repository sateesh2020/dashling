name: Release

# Push a tag like v0.2.0 to publish a multi-arch Docker image to GitHub Container Registry and create a GitHub Release.
# Tags with a dash (v0.2.0-rc1) are pre-releases: they get their own image tag but NOT the "latest" tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Tests must pass first
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: bash test/gates/refusals.sh && bash test/gates/linux.sh

  publish:
    name: Publish image and release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Safe to re-run, and safe if you already created the release by hand in the GitHub UI.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: leaving it as is (the image was still published)."
          else
            flags=()
            [[ "$TAG" == *-* ]] && flags+=(--prerelease)      # v0.1.0-rc1, v1.0.0-beta.2 ... are pre-releases and never become "latest"
            gh release create "$TAG" --generate-notes --title "$TAG" "${flags[@]}"
          fi
